name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run lint

      - run: npm run typecheck

      # scripts/vercel-build.js runs migration deployment + schema health check in
      # strict mode whenever CI=true, so the Turso credentials must be provided
      # here instead of relying on .env.local (gitignored, absent on CI runners).
      - run: npm run build
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: npm run runtime-smoke

      - run: npm run real-e2e
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEPLOY_GATE_WORKER_FAILED_WINDOW_MINUTES: "60"

  production-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Wait for Vercel Git deployment
        run: sleep 120

      - name: Production health gate
        run: npm run postdeploy:health:prod
        env:
          SWIFT_POST_DEPLOY_HEALTH_RETRIES: "12"
          SWIFT_POST_DEPLOY_HEALTH_RETRY_DELAY_MS: "10000"
